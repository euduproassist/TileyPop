<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TileyPop - Napo Studios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        .game-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- Loading Screen UI --- */
        .loading-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .loading-ui-layer.active {
            opacity: 1;
        }

        .loading-controls {
            position: absolute;
            top: 63%;
            width: 72vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-track {
            width: 100%;
            height: 3.3vh;
            padding: 0.35vh;
            background: rgba(235, 245, 255, 0.9);
            border: 0.3vh solid #1d6fd8;
            border-radius: 999px;
            box-shadow: 0 0.5vh 1.4vh rgba(15, 76, 158, 0.18), inset 0 0.25vh 0.5vh rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(180deg, #4da3ff 0%, #1668dc 55%, #0c4da8 100%);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .loading-text {
            margin-top: 1.4vh;
            color: #1668dc;
            font-size: 2.5vh;
            font-weight: 800;
            letter-spacing: 0.08vw;
            text-shadow: 0 0.25vh 0 rgba(255, 255, 255, 0.85);
        }

        /* --- Home / Play Screen UI (3rd Screen) --- */
        .menu-ui-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 5;
        }

        .menu-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .currency-bar {
            position: absolute;
            top: max(18px, calc(env(safe-area-inset-top) + 12px));
            left: max(14px, calc(env(safe-area-inset-left) + 12px));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 6;
        }

        .currency-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 7px 5px 6px;
            background: rgba(255, 255, 255, 0.94);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(15, 56, 118, 0.14), 0 1px 3px rgba(15, 56, 118, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .currency-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }

        .currency-value {
            color: #102a54;
            font-size: 0.98rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            line-height: 1;
            min-width: 18px;
            text-align: center;
        }

        .currency-plus-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(180deg, #459bff 0%, #1864dc 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(24, 100, 220, 0.35);
            transition: transform 0.12s ease, filter 0.12s ease;
            flex-shrink: 0;
        }

        .currency-plus-btn:active {
            transform: scale(0.92);
            filter: brightness(0.95);
        }

        /* Top-Right Settings Button (matches top-right circle gear position) */
        .menu-top-settings-btn {
            position: absolute;
            top: max(18px, calc(env(safe-area-inset-top) + 12px));
            right: max(14px, calc(env(safe-area-inset-right) + 12px));
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
            box-shadow: 0 6px 14px rgba(16, 62, 134, 0.16), inset 0 -2px 4px rgba(173, 211, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 6;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .menu-top-settings-btn:active {
            transform: scale(0.92);
        }

        .menu-top-settings-btn svg {
            width: 25px;
            height: 25px;
            fill: #0d2b6b;
        }

        /* Center Play Pill Button (matches Photo 1 exactly) */
        .play-hitbox {
            position: absolute;
            top: 49.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 270px;
            height: 9.2%;
            max-height: 68px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(180deg, #3b9eff 0%, #1a73e8 52%, #0e58c9 100%);
            box-shadow:
                0 7px 14px rgba(14, 72, 168, 0.34),
                0 2px 0 #0a45a6,
                inset 0 2px 3px rgba(255, 255, 255, 0.42);
            color: #ffffff;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.14s ease, filter 0.14s ease;
        }

        .play-hitbox:active {
            transform: translateX(-50%) scale(0.96);
            filter: brightness(0.96);
        }

        .play-hitbox svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* Bottom Row: Progress, Store, Settings Cards (matches Photo 1 exactly) */
        .nav-icons-row {
            position: absolute;
            top: 63.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            max-width: 380px;
            height: 13.5%;
            max-height: 102px;
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        .nav-hitbox {
            flex: 1;
            height: 100%;
            border: none;
            border-radius: 26px;
            background: linear-gradient(180deg, #ffffff 0%, #f1f6fe 100%);
            box-shadow:
                0 6px 14px rgba(18, 68, 148, 0.15),
                0 2px 0 rgba(196, 219, 252, 0.9),
                inset 0 1px 2px #ffffff;
            color: #0b2c6b;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 4px;
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .nav-hitbox:active {
            transform: scale(0.94);
        }

        .nav-hitbox svg {
            width: 34px;
            height: 34px;
            fill: #0b2c6b;
            flex-shrink: 0;
        }

        /* --- Gameplay Mode Selection Screen UI --- */
        .gameplay-ui-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: max(18px, calc(env(safe-area-inset-top) + 12px)) 18px max(24px, env(safe-area-inset-bottom));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease-in-out;
            z-index: 10;
        }

        .gameplay-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Top Bar: Home & Settings Hardcoded Buttons */
        .gameplay-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .circle-icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
            box-shadow: 0 6px 14px rgba(16, 62, 134, 0.16), inset 0 -2px 4px rgba(173, 211, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .circle-icon-btn:active {
            transform: scale(0.92);
        }

        .circle-icon-btn svg {
            width: 25px;
            height: 25px;
            fill: #0d2b6b;
        }

        /* Gameplay Banner Header (Uses gameplay.webp) */
        .gameplay-header-banner {
            margin-top: 6vh;
            margin-bottom: 4.5vh;
            width: 82%;
            max-width: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gameplay-banner-img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 6px 12px rgba(16, 78, 173, 0.18));
        }

        /* Mode Cards Stack */
        .modes-list {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .mode-card {
            width: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(242, 248, 255, 0.94) 100%);
            border: 2.5px solid #ffffff;
            border-radius: 34px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow:
                0 10px 22px rgba(20, 84, 179, 0.14),
                0 0 0 1.5px rgba(132, 187, 255, 0.55),
                inset 0 -3px 6px rgba(186, 219, 255, 0.4);
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .mode-card:active {
            transform: scale(0.985);
        }

        .mode-art {
            width: 88px;
            height: 78px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }

        .mode-divider {
            width: 2px;
            height: 60px;
            background: linear-gradient(180deg, rgba(56, 128, 232, 0.25) 0%, rgba(44, 113, 219, 0.8) 50%, rgba(56, 128, 232, 0.25) 100%);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .mode-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .mode-title {
            color: #0d2b6b;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            line-height: 1.15;
            margin-bottom: 4px;
        }

        .mode-desc {
            color: #1c3d7a;
            font-size: 0.84rem;
            font-weight: 500;
            line-height: 1.3;
        }

        /* Hardcoded Blue Circular Play Button */
        .mode-play-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid #72b9ff;
            background: radial-gradient(circle at 35% 25%, #58afff 0%, #1d75ec 65%, #1258c4 100%);
            box-shadow: 0 5px 12px rgba(21, 96, 209, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .mode-play-btn:active {
            transform: scale(0.92);
            filter: brightness(0.95);
        }

        .mode-play-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            margin-left: 3px;
            filter: drop-shadow(0 1px 2px rgba(10, 52, 122, 0.35));
        }

        @media (max-height: 680px) {
            .gameplay-header-banner {
                margin-top: 3vh;
                margin-bottom: 2.5vh;
                width: 72%;
            }
            .modes-list {
                gap: 15px;
            }
            .mode-card {
                padding: 9px 12px;
                border-radius: 28px;
            }
            .mode-art {
                width: 72px;
                height: 64px;
            }
            .mode-title {
                font-size: 1.1rem;
            }
            .mode-desc {
                font-size: 0.78rem;
            }
            .mode-play-btn {
                width: 46px;
                height: 46px;
            }
        }
    </style>
</head>
<body>

    <div class="screen-container" id="appContainer">
        <!-- 1st Screen: Studio Screen -->
        <img src="./assets/studio.webp" alt="Napo Studios" class="game-canvas active" id="screenStudio">

        <!-- 2nd Screen: Loading Screen Background -->
        <img src="./assets/loading.webp" alt="Loading Background" class="game-canvas" id="screenLoadingBg">

        <!-- Loading UI Elements -->
        <div class="loading-ui-layer" id="loadingUi">
            <div class="loading-controls">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="loading-text" id="loadingText">Loading...</div>
            </div>
        </div>

        <!-- 3rd Screen: Home / Play Screen Background (Uses loading.webp) & Hardcoded Buttons -->
        <img src="./assets/loading.webp" alt="Home Background" class="game-canvas" id="screenMenuBg">

        <div class="menu-ui-layer" id="menuUi">
            <!-- Top-Left Coins & Diamonds Pills -->
            <div class="currency-bar" aria-label="Currencies">
                <div class="currency-pill">
                    <img src="./assets/coin.webp" alt="Coins" class="currency-icon">
                    <span class="currency-value" id="coinCount">250</span>
                    <button type="button" class="currency-plus-btn" aria-label="Add Coins" onclick="handleCurrencyPlus('coins')">+</button>
                </div>

                <div class="currency-pill">
                    <img src="./assets/diamond.webp" alt="Diamonds" class="currency-icon">
                    <span class="currency-value" id="diamondCount">15</span>
                    <button type="button" class="currency-plus-btn" aria-label="Add Diamonds" onclick="handleCurrencyPlus('diamonds')">+</button>
                </div>
            </div>

            <!-- Top-Right Hardcoded Settings Button -->
            <button type="button" class="menu-top-settings-btn" aria-label="Settings" onclick="handleMenuAction('settings')">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6Z"/>
                </svg>
            </button>

            <!-- Hardcoded Play Button -->
            <button type="button" class="play-hitbox" aria-label="Play" onclick="handleMenuAction('play')">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7.5 4.3a1.3 1.3 0 0 1 2-.98l11.2 7.7a1.3 1.3 0 0 1 0 2.16l-11.2 7.7a1.3 1.3 0 0 1-2-.98V4.3Z"/>
                </svg>
                <span>Play</span>
            </button>

            <!-- Hardcoded Progress, Store & Settings Row -->
            <div class="nav-icons-row">
                <button type="button" class="nav-hitbox" aria-label="Progress" onclick="handleMenuAction('progress')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="4" y="16" width="3.8" height="5" rx="1.2"/>
                        <rect x="10.1" y="13" width="3.8" height="8" rx="1.2"/>
                        <rect x="16.2" y="9.5" width="3.8" height="11.5" rx="1.2"/>
                        <path d="M4.6 12.6c3.3-1.2 6.3-3.1 9.4-5.7l-1.3-.2c-.6-.1-.9-.6-.8-1.2.1-.6.6-.9 1.2-.8l3.9.5c.6.1 1 .6.9 1.2l-.4 3.8c-.1.6-.6 1-1.2.9-.6-.1-.9-.6-.8-1.2l.1-1.2c-3.3 2.7-6.5 4.7-10 6-.6.2-1.2-.1-1.4-.7-.2-.6.1-1.2.7-1.4Z"/>
                    </svg>
                    <span>Progress</span>
                </button>

                <button type="button" class="nav-hitbox" aria-label="Store" onclick="handleMenuAction('store')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2.5 4.2a1.1 1.1 0 0 1 1.1-1.1h2.1c.5 0 .95.34 1.07.82L7.3 6h12.6a1.1 1.1 0 0 1 1.06 1.38l-1.55 6a1.1 1.1 0 0 1-1.06.82H8.85l.35 1.5h9.4a1.1 1.1 0 1 1 0 2.2H8.3a1.1 1.1 0 0 1-1.07-.85L4.82 5.3H3.6a1.1 1.1 0 0 1-1.1-1.1Z"/>
                        <circle cx="9.2" cy="20" r="1.7"/>
                        <circle cx="17.3" cy="20" r="1.7"/>
                    </svg>
                    <span>Store</span>
                </button>

                <button type="button" class="nav-hitbox" aria-label="Settings" onclick="handleMenuAction('settings')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6Z"/>
                    </svg>
                    <span>Settings</span>
                </button>
            </div>
        </div>

        <!-- 4th Screen: Gameplay Mode Selection Screen -->
        <img src="./assets/background.webp" alt="Gameplay Background" class="game-canvas" id="screenGameplayBg">

        <div class="gameplay-ui-layer" id="gameplayUi">
            <!-- Top Bar: Home & Settings Icons -->
            <div class="gameplay-top-bar">
                <button type="button" class="circle-icon-btn" aria-label="Back to Home" onclick="transitionGameplayToHome()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11.3 2.3a1 1 0 0 1 1.4 0l8.6 7.8a1 1 0 0 1-.67 1.74H19v8.16a1.5 1.5 0 0 1-1.5 1.5h-3.25a.75.75 0 0 1-.75-.75v-4.5a1.5 1.5 0 0 0-3 0v4.5a.75.75 0 0 1-.75.75H6.5A1.5 1.5 0 0 1 5 20v-8.16H3.37a1 1 0 0 1-.67-1.74l8.6-7.8Z"/>
                    </svg>
                </button>

                <button type="button" class="circle-icon-btn" aria-label="Settings" onclick="handleGameplaySettings()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6Z"/>
                    </svg>
                </button>
            </div>

            <!-- Gameplay Title Image -->
            <div class="gameplay-header-banner">
                <img src="./assets/gameplay.webp" alt="Gameplay" class="gameplay-banner-img">
            </div>

            <!-- Game Mode Cards -->
            <div class="modes-list">
                <!-- Card 1: My Photo -->
                <div class="mode-card" onclick="selectGameMode('my-photo')">
                    <img src="./assets/pappy.webp" alt="My Photo" class="mode-art">
                    <div class="mode-divider"></div>
                    <div class="mode-info">
                        <div class="mode-title">My Photo</div>
                        <div class="mode-desc">Upload your own photo from your gallery.</div>
                    </div>
                    <button type="button" class="mode-play-btn" aria-label="Play My Photo">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/>
                        </svg>
                    </button>
                </div>

                <!-- Card 2: Levels -->
                <div class="mode-card" onclick="selectGameMode('levels')">
                    <img src="./assets/journey.webp" alt="Levels" class="mode-art">
                    <div class="mode-divider"></div>
                    <div class="mode-info">
                        <div class="mode-title">Levels</div>
                        <div class="mode-desc">Complete levels and unlock more puzzles.</div>
                    </div>
                    <button type="button" class="mode-play-btn" aria-label="Play Levels">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/>
                        </svg>
                    </button>
                </div>

                <!-- Card 3: Daily Challenge -->
                <div class="mode-card" onclick="selectGameMode('daily-challenge')">
                    <img src="./assets/calendar.webp" alt="Daily Challenge" class="mode-art">
                    <div class="mode-divider"></div>
                    <div class="mode-info">
                        <div class="mode-title">Daily Challenge</div>
                        <div class="mode-desc">Get a new hard challenge every day!</div>
                    </div>
                    <button type="button" class="mode-play-btn" aria-label="Play Daily Challenge">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function lockPortraitOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }

        window.addEventListener('load', () => {
            lockPortraitOrientation();
            startSequence();
        });

        window.addEventListener('orientationchange', () => {
            lockPortraitOrientation();
        });

        function startSequence() {
            setTimeout(() => {
                transitionToLoadingScreen();
            }, 3000);
        }

        function transitionToLoadingScreen() {
            const studioScreen = document.getElementById('screenStudio');
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');

            studioScreen.classList.remove('active');
            loadingBg.classList.add('active');
            loadingUi.classList.add('active');

            runLoadingSequence();
        }

        function runLoadingSequence() {
            let currentProgress = 0;
            const fillElement = document.getElementById('progressBarFill');
            const textElement = document.getElementById('loadingText');

            let dotCounter = 0;
            const textInterval = setInterval(() => {
                dotCounter = (dotCounter % 3) + 1;
                textElement.textContent = "Loading" + ".".repeat(dotCounter);
            }, 400);

            const totalDuration = 2500;
            const intervalStep = 25;
            const incrementAmount = 100 / (totalDuration / intervalStep);

            const progressInterval = setInterval(() => {
                currentProgress += incrementAmount;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(progressInterval);
                    clearInterval(textInterval);

                    setTimeout(transitionToMenuScreen, 350);
                }

                const roundedProgress = Math.floor(currentProgress);
                fillElement.style.width = roundedProgress + '%';
            }, intervalStep);
        }

        function transitionToMenuScreen() {
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            loadingBg.classList.remove('active');
            loadingUi.classList.remove('active');

            menuBg.classList.add('active');
            menuUi.classList.add('active');
        }

        function transitionHomeToGameplay() {
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');
            const gameplayBg = document.getElementById('screenGameplayBg');
            const gameplayUi = document.getElementById('gameplayUi');

            menuBg.classList.remove('active');
            menuUi.classList.remove('active');

            gameplayBg.classList.add('active');
            gameplayUi.classList.add('active');
        }

        function transitionGameplayToHome() {
            const gameplayBg = document.getElementById('screenGameplayBg');
            const gameplayUi = document.getElementById('gameplayUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            gameplayBg.classList.remove('active');
            gameplayUi.classList.remove('active');

            menuBg.classList.add('active');
            menuUi.classList.add('active');
        }

        let coins = 250;
        let diamonds = 15;

        function updateCurrencyDisplay() {
            document.getElementById('coinCount').textContent = coins.toLocaleString();
            document.getElementById('diamondCount').textContent = diamonds.toLocaleString();
        }

        function handleCurrencyPlus(type) {
            console.log("Currency plus clicked:", type);
        }

        function handleMenuAction(actionType) {
            if (actionType === 'play') {
                transitionHomeToGameplay();
            } else {
                console.log("Menu action triggered:", actionType);
            }
        }

        function handleGameplaySettings() {
            console.log("Gameplay settings clicked");
        }

        function selectGameMode(mode) {
            console.log("Selected game mode:", mode);
        }

        updateCurrencyDisplay();
    </script>
</body>
</html>
