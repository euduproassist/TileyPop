<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TileyPop - Napo Studios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            opacity: 0;
            transition: opacity 0.6s ease-in-out;
            pointer-events: none;
        }

        .game-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }

        .loading-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .loading-ui-layer.active {
            opacity: 1;
        }

        .loading-controls {
            position: absolute;
            top: 63%;
            width: 72vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-track {
            width: 100%;
            height: 3.3vh;
            padding: 0.35vh;
            background: rgba(235, 245, 255, 0.9);
            border: 0.3vh solid #1d6fd8;
            border-radius: 999px;
            box-shadow: 0 0.5vh 1.4vh rgba(15, 76, 158, 0.18), inset 0 0.25vh 0.5vh rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(180deg, #4da3ff 0%, #1668dc 55%, #0c4da8 100%);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .loading-text {
            margin-top: 1.4vh;
            color: #1668dc;
            font-size: 2.5vh;
            font-weight: 800;
            letter-spacing: 0.08vw;
            text-shadow: 0 0.25vh 0 rgba(255, 255, 255, 0.85);
        }

        .menu-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .menu-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .play-hitbox {
            position: absolute;
            top: 49%;
            left: 50%;
            transform: translateX(-50%);
            width: 62%;
            max-width: 300px;
            height: 10.5%;
            max-height: 78px;
            cursor: pointer;
            border-radius: 999px;
        }

        .nav-icons-row {
            position: absolute;
            top: 63.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            max-width: 400px;
            height: 13.5%;
            max-height: 105px;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .nav-hitbox {
            flex: 1;
            height: 100%;
            cursor: default;
            border-radius: 20px;
        }
    </style>
</head>
<body>

    <div class="screen-container" id="appContainer">
        <!-- 1st Photo: Studio Screen -->
        <img src="./assets/studio.webp" alt="Napo Studios" class="game-canvas active" id="screenStudio">

        <!-- 2nd Photo: Loading Screen Background -->
        <img src="./assets/loading.webp" alt="Loading Background" class="game-canvas" id="screenLoadingBg">

        <!-- Loading UI Elements -->
        <div class="loading-ui-layer" id="loadingUi">
            <div class="loading-controls">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="loading-text" id="loadingText">Loading...</div>
            </div>
        </div>

        <!-- 3rd Photo: Home Screen Background & Interactive Layer -->
        <img src="./assets/home.webp" alt="Home Background" class="game-canvas" id="screenMenuBg">

        <div class="menu-ui-layer" id="menuUi">
            <div class="play-hitbox" onclick="handleMenuAction('play')"></div>
            <div class="nav-icons-row">
                <div class="nav-hitbox" onclick="handleMenuAction('progress')"></div>
                <div class="nav-hitbox" onclick="handleMenuAction('store')"></div>
                <div class="nav-hitbox" onclick="handleMenuAction('settings')"></div>
            </div>
        </div>
    </div>

    <script>
        function lockPortraitOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }

        window.addEventListener('load', () => {
            lockPortraitOrientation();
            startSequence();
        });

        window.addEventListener('orientationchange', () => {
            lockPortraitOrientation();
        });

        function startSequence() {
            setTimeout(() => {
                transitionToLoadingScreen();
            }, 3000);
        }

        function transitionToLoadingScreen() {
            const studioScreen = document.getElementById('screenStudio');
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');

            studioScreen.classList.remove('active');
            loadingBg.classList.add('active');
            loadingUi.classList.add('active');

            runLoadingSequence();
        }

        function runLoadingSequence() {
            let currentProgress = 0;
            const fillElement = document.getElementById('progressBarFill');
            const textElement = document.getElementById('loadingText');

            let dotCounter = 0;
            const textInterval = setInterval(() => {
                dotCounter = (dotCounter % 3) + 1;
                textElement.textContent = "Loading" + ".".repeat(dotCounter);
            }, 400);

            const totalDuration = 2500;
            const intervalStep = 25;
            const incrementAmount = 100 / (totalDuration / intervalStep);

            const progressInterval = setInterval(() => {
                currentProgress += incrementAmount;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(progressInterval);
                    clearInterval(textInterval);

                    setTimeout(transitionToMenuScreen, 350);
                }

                const roundedProgress = Math.floor(currentProgress);
                fillElement.style.width = roundedProgress + '%';
            }, intervalStep);
        }

        function transitionToMenuScreen() {
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            loadingBg.classList.remove('active');
            loadingUi.classList.remove('active');

            menuBg.classList.add('active');
            menuUi.classList.add('active');
        }

        function handleMenuAction(actionType) {
            if (actionType === 'play') {
                console.log("Menu action triggered:", actionType);
            }
        }
    </script>
</body>
</html>
