<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TileyPop - Napo Studios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            height: 100dvh;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        .game-canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: fill;
            object-position: center;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
            pointer-events: none;
        }

        .game-canvas.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* --- Loading Screen UI --- */
        .loading-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .loading-ui-layer.active {
            opacity: 1;
        }

        .loading-controls {
            position: absolute;
            top: 63%;
            width: 72vw;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-track {
            width: 100%;
            height: 3.3vh;
            padding: 0.35vh;
            background: rgba(235, 245, 255, 0.9);
            border: 0.3vh solid #1d6fd8;
            border-radius: 999px;
            box-shadow: 0 0.5vh 1.4vh rgba(15, 76, 158, 0.18), inset 0 0.25vh 0.5vh rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(180deg, #4da3ff 0%, #1668dc 55%, #0c4da8 100%);
            border-radius: 999px;
            transition: width 0.1s linear;
        }

        .loading-text {
            margin-top: 1.4vh;
            color: #1668dc;
            font-size: 2.5vh;
            font-weight: 800;
            letter-spacing: 0.08vw;
            text-shadow: 0 0.25vh 0 rgba(255, 255, 255, 0.85);
        }

        /* --- Home / Play Screen UI (3rd Screen) --- */
        .menu-ui-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
            z-index: 5;
        }

        .menu-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .currency-bar {
            position: absolute;
            top: max(18px, calc(env(safe-area-inset-top) + 12px));
            left: max(14px, calc(env(safe-area-inset-left) + 12px));
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 6;
        }

        .currency-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 5px 7px 5px 6px;
            background: rgba(255, 255, 255, 0.94);
            border: 1.5px solid rgba(255, 255, 255, 0.85);
            border-radius: 999px;
            box-shadow: 0 6px 16px rgba(15, 56, 118, 0.14), 0 1px 3px rgba(15, 56, 118, 0.08);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .currency-icon {
            width: 26px;
            height: 26px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }

        .currency-value {
            color: #102a54;
            font-size: 0.98rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            line-height: 1;
            min-width: 18px;
            text-align: center;
        }

        .currency-plus-btn {
            width: 24px;
            height: 24px;
            border: none;
            border-radius: 50%;
            background: linear-gradient(180deg, #459bff 0%, #1864dc 100%);
            color: #ffffff;
            font-size: 1rem;
            font-weight: 700;
            line-height: 1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(24, 100, 220, 0.35);
            transition: transform 0.12s ease, filter 0.12s ease;
            flex-shrink: 0;
        }

        .currency-plus-btn:active {
            transform: scale(0.92);
            filter: brightness(0.95);
        }

        /* Center Play Pill Button (matches Photo 1 exactly) */
        .play-hitbox {
            position: absolute;
            top: 49.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 60%;
            max-width: 270px;
            height: 9.2%;
            max-height: 68px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(180deg, #3b9eff 0%, #1a73e8 52%, #0e58c9 100%);
            box-shadow:
                0 7px 14px rgba(14, 72, 168, 0.34),
                0 2px 0 #0a45a6,
                inset 0 2px 3px rgba(255, 255, 255, 0.42);
            color: #ffffff;
            font-size: 1.65rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            cursor: pointer;
            transition: transform 0.14s ease, filter 0.14s ease;
        }

        .play-hitbox:active {
            transform: translateX(-50%) scale(0.96);
            filter: brightness(0.96);
        }

        .play-hitbox svg {
            width: 30px;
            height: 30px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* Bottom Row: Progress, Store, Settings Cards (matches Photo 1 exactly) */
        .nav-icons-row {
            position: absolute;
            top: 63.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            max-width: 380px;
            height: 13.5%;
            max-height: 102px;
            display: flex;
            justify-content: space-between;
            gap: 14px;
        }

        .nav-hitbox {
            flex: 1;
            height: 100%;
            border: none;
            border-radius: 26px;
            background: linear-gradient(180deg, #ffffff 0%, #f1f6fe 100%);
            box-shadow:
                0 6px 14px rgba(18, 68, 148, 0.15),
                0 2px 0 rgba(196, 219, 252, 0.9),
                inset 0 1px 2px #ffffff;
            color: #0b2c6b;
            font-size: 0.9rem;
            font-weight: 800;
            letter-spacing: -0.2px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 6px 4px;
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .nav-hitbox:active {
            transform: scale(0.94);
        }

        .nav-hitbox svg {
            width: 34px;
            height: 34px;
            fill: #0b2c6b;
            flex-shrink: 0;
        }

        /* --- Gameplay Mode Selection Screen UI --- */
        .gameplay-ui-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: max(18px, calc(env(safe-area-inset-top) + 12px)) 18px max(24px, env(safe-area-inset-bottom));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease-in-out;
            z-index: 10;
        }

        .gameplay-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        /* Top Bar: Home & Settings Hardcoded Buttons */
        .gameplay-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .circle-icon-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
            box-shadow: 0 6px 14px rgba(16, 62, 134, 0.16), inset 0 -2px 4px rgba(173, 211, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.14s ease, box-shadow 0.14s ease;
        }

        .circle-icon-btn:active {
            transform: scale(0.92);
        }

        .circle-icon-btn svg {
            width: 25px;
            height: 25px;
            fill: #0d2b6b;
        }

        /* Gameplay Banner Header (Uses gameplay.webp) */
        .gameplay-header-banner {
            margin-top: 6vh;
            margin-bottom: 4.5vh;
            width: 82%;
            max-width: 340px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gameplay-banner-img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
            filter: drop-shadow(0 6px 12px rgba(16, 78, 173, 0.18));
        }

        /* Mode Cards Stack */
        .modes-list {
            width: 100%;
            max-width: 410px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        .mode-card {
            width: 100%;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.96) 0%, rgba(242, 248, 255, 0.94) 100%);
            border: 2.5px solid #ffffff;
            border-radius: 34px;
            padding: 12px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            box-shadow:
                0 10px 22px rgba(20, 84, 179, 0.14),
                0 0 0 1.5px rgba(132, 187, 255, 0.55),
                inset 0 -3px 6px rgba(186, 219, 255, 0.4);
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .mode-card:active {
            transform: scale(0.985);
        }

        .mode-art {
            width: 88px;
            height: 78px;
            object-fit: contain;
            flex-shrink: 0;
            display: block;
        }

        .mode-divider {
            width: 2px;
            height: 60px;
            background: linear-gradient(180deg, rgba(56, 128, 232, 0.25) 0%, rgba(44, 113, 219, 0.8) 50%, rgba(56, 128, 232, 0.25) 100%);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .mode-info {
            flex: 1;
            min-width: 0;
            text-align: left;
        }

        .mode-title {
            color: #0d2b6b;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.3px;
            line-height: 1.15;
            margin-bottom: 4px;
        }

        .mode-desc {
            color: #1c3d7a;
            font-size: 0.84rem;
            font-weight: 500;
            line-height: 1.3;
        }

        /* Hardcoded Blue Circular Play Button */
        .mode-play-btn {
            width: 54px;
            height: 54px;
            border-radius: 50%;
            border: 2px solid #72b9ff;
            background: radial-gradient(circle at 35% 25%, #58afff 0%, #1d75ec 65%, #1258c4 100%);
            box-shadow: 0 5px 12px rgba(21, 96, 209, 0.35), inset 0 2px 3px rgba(255, 255, 255, 0.55);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.12s ease, filter 0.12s ease;
        }

        .mode-play-btn:active {
            transform: scale(0.92);
            filter: brightness(0.95);
        }

        .mode-play-btn svg {
            width: 22px;
            height: 22px;
            fill: #ffffff;
            margin-left: 3px;
            filter: drop-shadow(0 1px 2px rgba(10, 52, 122, 0.35));
        }

        /* --- My Photo Grid Mode Screen UI --- */
        .my-photo-ui-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: max(18px, calc(env(safe-area-inset-top) + 12px)) 18px max(28px, calc(env(safe-area-inset-bottom) + 20px));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease-in-out;
            z-index: 12;
        }

        .my-photo-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .my-photo-top-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .my-photo-panel {
            width: 100%;
            max-width: 410px;
            background: transparent;
            border: none;
            border-radius: 0;
            padding: 0;
            box-shadow: none;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto 0;
        }

        .grid-mode-heading-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }

        .grid-mode-heading-line {
            flex: 1;
            height: 2px;
            background: rgba(94, 158, 245, 0.55);
            border-radius: 2px;
        }

        .grid-mode-heading {
            color: #0b2d75;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.3px;
            white-space: nowrap;
        }

        .grid-selector-row {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 22px;
        }

        .grid-arrow-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #e9f3ff 100%);
            box-shadow: 0 5px 12px rgba(16, 68, 152, 0.16), inset 0 -2px 4px rgba(173, 211, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .grid-arrow-btn:active {
            transform: scale(0.92);
        }

        .grid-arrow-btn svg {
            width: 18px;
            height: 18px;
            stroke: #1248b8;
            stroke-width: 3.4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .grid-cards-group {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex: 1;
        }

        .grid-option-card {
            flex: 1;
            max-width: 92px;
            height: 96px;
            border-radius: 22px;
            border: 2.5px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
            box-shadow:
                0 6px 14px rgba(18, 76, 168, 0.13),
                0 0 0 1.5px rgba(145, 194, 255, 0.55);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            transition: transform 0.14s ease, background 0.16s ease, box-shadow 0.16s ease;
        }

        .grid-option-card:active {
            transform: scale(0.94);
        }

        .grid-option-card.active {
            background: linear-gradient(180deg, #4da5ff 0%, #1d75ec 60%, #1258c4 100%);
            border-color: #96cbff;
            box-shadow:
                0 8px 18px rgba(21, 96, 209, 0.32),
                0 0 0 2px #2c84ff,
                inset 0 2px 4px rgba(255, 255, 255, 0.5);
        }

        .grid-matrix {
            display: grid;
            gap: 3px;
            width: 42px;
            height: 42px;
        }

        .grid-matrix.cols-3 {
            grid-template-columns: repeat(3, 1fr);
        }

        .grid-matrix.cols-4 {
            grid-template-columns: repeat(4, 1fr);
            gap: 2.5px;
        }

        .grid-matrix.cols-5 {
            grid-template-columns: repeat(5, 1fr);
            gap: 2px;
        }

        .grid-cell {
            background: #2780f5;
            border-radius: 2.5px;
            transition: background 0.16s ease;
        }

        .grid-option-card.active .grid-cell {
            background: #ffffff;
        }

        .grid-option-label {
            color: #0d2e75;
            font-size: 1.05rem;
            font-weight: 900;
            line-height: 1;
            transition: color 0.16s ease;
        }

        .grid-option-card.active .grid-option-label {
            color: #ffffff;
        }

        .panel-divider-line {
            width: 92%;
            height: 2px;
            background: rgba(94, 158, 245, 0.45);
            border-radius: 2px;
            margin-bottom: 20px;
        }

        .upload-photo-card {
            width: 100%;
            min-height: 78px;
            border-radius: 26px;
            border: 2.5px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #eef6ff 100%);
            box-shadow:
                0 8px 18px rgba(18, 76, 168, 0.14),
                0 0 0 1.5px rgba(145, 194, 255, 0.55);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 24px;
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .upload-photo-card:active {
            transform: scale(0.985);
        }

        .upload-cloud-icon {
            width: 44px;
            height: 36px;
            fill: #1b72eb;
            flex-shrink: 0;
        }

        .upload-card-divider {
            width: 2px;
            height: 44px;
            background: rgba(72, 144, 240, 0.45);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .upload-card-label {
            flex: 1;
            color: #0d2b6b;
            font-size: 1.15rem;
            font-weight: 800;
            text-align: left;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .upload-tray-btn {
            width: 52px;
            height: 46px;
            border-radius: 16px;
            border: 2px solid #75baff;
            background: linear-gradient(180deg, #52aaff 0%, #1d75ec 65%, #1258c4 100%);
            box-shadow: 0 5px 12px rgba(21, 96, 209, 0.3), inset 0 2px 3px rgba(255, 255, 255, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            cursor: pointer;
            transition: transform 0.12s ease;
        }

        .upload-tray-btn:active {
            transform: scale(0.92);
        }

        .upload-tray-btn svg {
            width: 22px;
            height: 22px;
            stroke: #ffffff;
            stroke-width: 2.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
        }

        .continue-cta-wrap {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .continue-btn {
            flex: 1;
            max-width: 270px;
            height: 62px;
            border-radius: 999px;
            border: 2.5px solid #86c4ff;
            background: linear-gradient(180deg, #54abff 0%, #1c74ec 55%, #0f56c2 100%);
            box-shadow:
                0 8px 18px rgba(18, 84, 188, 0.35),
                0 3px 0 #0a429c,
                inset 0 2px 4px rgba(255, 255, 255, 0.55);
            color: #ffffff;
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            cursor: pointer;
            transition: transform 0.14s ease, filter 0.14s ease;
        }

        .continue-btn:active {
            transform: scale(0.96);
            filter: brightness(0.96);
        }

        .continue-btn svg {
            width: 24px;
            height: 24px;
            fill: #ffffff;
            flex-shrink: 0;
        }

        /* --- Settings Screen UI --- */
        .settings-ui-layer {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: max(18px, calc(env(safe-area-inset-top) + 12px)) 20px max(26px, calc(env(safe-area-inset-bottom) + 18px));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.45s ease-in-out;
            z-index: 15;
        }

        .settings-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .settings-top-row {
            width: 100%;
            display: flex;
            justify-content: flex-end;
            align-items: center;
        }

        .settings-close-btn {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            border: 2.5px solid #ffffff;
            background: linear-gradient(180deg, #ffffff 0%, #eaf3ff 100%);
            box-shadow:
                0 6px 14px rgba(18, 76, 168, 0.18),
                0 0 0 1.5px rgba(145, 194, 255, 0.55),
                inset 0 -2px 4px rgba(173, 211, 255, 0.45);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .settings-close-btn:active {
            transform: scale(0.92);
        }

        .settings-close-btn svg {
            width: 22px;
            height: 22px;
            stroke: #0c337d;
            stroke-width: 3.2;
            stroke-linecap: round;
        }

        .settings-center-group {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: -12px;
        }

        .settings-heading {
            color: #0c2c6d;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 0.4px;
            line-height: 1.1;
            margin-bottom: 30px;
            text-shadow: 0 2px 6px rgba(255, 255, 255, 0.75);
        }

        .audio-toggles-row {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            gap: 44px;
            margin-bottom: 34px;
        }

        .audio-toggle-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .audio-orb-btn {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            border: 3px solid #ffffff;
            background: radial-gradient(circle at 35% 24%, #ffffff 0%, #f1f7ff 68%, #dceaff 100%);
            box-shadow:
                0 10px 20px rgba(18, 76, 168, 0.16),
                0 0 0 2px rgba(145, 194, 255, 0.55),
                inset 0 -4px 8px rgba(155, 198, 255, 0.45),
                inset 0 4px 6px rgba(255, 255, 255, 0.95);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            position: relative;
            transition: transform 0.14s ease, background 0.2s ease, box-shadow 0.2s ease;
        }

        .audio-orb-btn:active {
            transform: scale(0.93);
        }

        .audio-orb-btn.is-on {
            background: radial-gradient(circle at 35% 22%, #86f55d 0%, #37c918 58%, #1d9609 100%);
            box-shadow:
                0 10px 20px rgba(24, 138, 12, 0.28),
                0 0 0 2px rgba(114, 219, 76, 0.55),
                inset 0 -4px 8px rgba(15, 112, 4, 0.45),
                inset 0 4px 7px rgba(215, 255, 196, 0.85);
        }

        .audio-orb-btn svg {
            width: 44px;
            height: 44px;
            fill: #1549b8;
            transition: fill 0.2s ease;
        }

        .audio-orb-btn.is-on svg {
            fill: #ffffff;
            filter: drop-shadow(0 1px 2px rgba(12, 82, 4, 0.35));
        }

        .audio-slash-line {
            position: absolute;
            width: 48px;
            height: 4.5px;
            border-radius: 999px;
            background: #1549b8;
            transform: rotate(40deg);
            pointer-events: none;
            opacity: 1;
            transition: opacity 0.18s ease;
        }

        .audio-orb-btn.is-on .audio-slash-line {
            opacity: 0;
        }

        .audio-toggle-label {
            color: #0c2c6d;
            font-size: 1.02rem;
            font-weight: 900;
            letter-spacing: 0.3px;
        }

        .settings-cards-stack {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .settings-row-card {
            width: 100%;
            min-height: 74px;
            background: linear-gradient(180deg, rgba(255, 255, 255, 0.97) 0%, rgba(243, 249, 255, 0.95) 100%);
            border: 2.5px solid #ffffff;
            border-radius: 26px;
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
            box-shadow:
                0 8px 18px rgba(20, 84, 179, 0.14),
                0 0 0 1.5px rgba(132, 187, 255, 0.55),
                inset 0 -3px 6px rgba(186, 219, 255, 0.35);
            cursor: pointer;
            transition: transform 0.14s ease;
        }

        .settings-row-card:active {
            transform: scale(0.985);
        }

        .settings-card-icon {
            width: 34px;
            height: 34px;
            fill: #1549b8;
            flex-shrink: 0;
            display: block;
        }

        .settings-card-divider {
            width: 2px;
            height: 44px;
            background: linear-gradient(180deg, rgba(72, 144, 240, 0.25) 0%, rgba(52, 126, 232, 0.75) 50%, rgba(72, 144, 240, 0.25) 100%);
            border-radius: 2px;
            flex-shrink: 0;
        }

        .settings-card-text {
            flex: 1;
            min-width: 0;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .settings-card-title {
            color: #0c2c6d;
            font-size: 1.25rem;
            font-weight: 800;
            letter-spacing: -0.25px;
            line-height: 1.2;
        }

        .settings-card-sub {
            color: #2185ff;
            font-size: 1.02rem;
            font-weight: 700;
            line-height: 1.25;
            margin-top: 2px;
        }

        .settings-card-chevron {
            width: 22px;
            height: 22px;
            stroke: #0c2c6d;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            flex-shrink: 0;
        }

        .settings-footer {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .settings-footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
            gap: 8px;
        }

        .settings-footer-btn {
            background: none;
            border: none;
            color: #0c2c6d;
            font-size: 0.92rem;
            font-weight: 700;
            cursor: pointer;
            padding: 2px 4px;
            transition: opacity 0.14s ease;
        }

        .settings-footer-btn:active {
            opacity: 0.65;
        }

        .settings-footer-sep {
            color: #287de8;
            font-size: 0.95rem;
            font-weight: 700;
            user-select: none;
        }

        .settings-build-version {
            color: #0c2c6d;
            font-size: 1.05rem;
            font-weight: 800;
            letter-spacing: 0.2px;
        }

        @media (max-height: 680px) {
            .gameplay-header-banner {
                margin-top: 3vh;
                margin-bottom: 2.5vh;
                width: 72%;
            }
            .modes-list {
                gap: 15px;
            }
            .mode-card {
                padding: 9px 12px;
                border-radius: 28px;
            }
            .mode-art {
                width: 72px;
                height: 64px;
            }
            .mode-title {
                font-size: 1.1rem;
            }
            .mode-desc {
                font-size: 0.78rem;
            }
            .mode-play-btn {
                width: 46px;
                height: 46px;
            }
            .settings-heading {
                font-size: 1.65rem;
                margin-bottom: 18px;
            }
            .audio-orb-btn {
                width: 78px;
                height: 78px;
            }
            .audio-toggles-row {
                gap: 32px;
                margin-bottom: 22px;
            }
            .settings-row-card {
                min-height: 62px;
                border-radius: 22px;
                padding: 10px 16px;
            }
            .settings-card-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>

    <div class="screen-container" id="appContainer">
        <!-- 1st Screen: Studio Screen -->
        <img src="./assets/studio.webp" alt="Napo Studios" class="game-canvas active" id="screenStudio">

        <!-- 2nd Screen: Loading Screen Background -->
        <img src="./assets/loading.webp" alt="Loading Background" class="game-canvas" id="screenLoadingBg">

        <!-- Loading UI Elements -->
        <div class="loading-ui-layer" id="loadingUi">
            <div class="loading-controls">
                <div class="progress-bar-track">

                </div>
                <div class="loading-text" id="loadingText">Loading...</div>
            </div>
        </div>

        <!-- 3rd Screen: Home / Play Screen Background (Uses loading.webp) & Hardcoded Buttons -->
        <img src="./assets/loading.webp" alt="Home Background" class="game-canvas" id="screenMenuBg">

        <div class="menu-ui-layer" id="menuUi">
            <!-- Top-Left Coins Pill -->
            <div class="currency-bar" aria-label="Currencies">
                <div class="currency-pill">
                    <img src="./assets/coin.webp" alt="Coins" class="currency-icon">
                    <span class="currency-value" id="coinCount">250</span>
                    <button type="button" class="currency-plus-btn" aria-label="Add Coins" onclick="handleCurrencyPlus('coins')">+</button>
                </div>
            </div>

            <!-- Hardcoded Play Button -->
            <button type="button" class="play-hitbox" aria-label="Play" onclick="handleMenuAction('play')">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M7.5 4.3a1.3 1.3 0 0 1 2-.98l11.2 7.7a1.3 1.3 0 0 1 0 2.16l-11.2 7.7a1.3 1.3 0 0 1-2-.98V4.3Z"/>
                </svg>
                <span>Play</span>
            </button>

            <!-- Hardcoded Progress, Store & Settings Row -->
            <div class="nav-icons-row">
                <button type="button" class="nav-hitbox" aria-label="Progress" onclick="handleMenuAction('progress')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <rect x="4.5" y="16.2" width="3.6" height="4.8" rx="1.2"/>
                        <rect x="10.2" y="13.4" width="3.6" height="7.6" rx="1.2"/>
                        <rect x="15.9" y="10.2" width="3.6" height="10.8" rx="1.2"/>
                        <path d="M5.4 9.8c2.6-.7 5.1-2.2 7.6-4.4l-1-.2c-.5-.1-.8-.5-.7-1 .1-.5.5-.8 1-.7l3.2.5c.5.1.8.5.8 1l-.3 3.2c-.1.5-.5.8-1 .7-.5-.1-.8-.5-.7-1l.1-.9c-2.6 2.2-5.2 3.8-8 4.6-.5.1-1-.1-1.1-.6-.1-.5.1-1 .6-1.1Z"/>
                    </svg>
                    <span>Progress</span>
                </button>

                <button type="button" class="nav-hitbox" aria-label="Store" onclick="handleMenuAction('store')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M2.5 4.2a1.1 1.1 0 0 1 1.1-1.1h2.1c.5 0 .95.34 1.07.82L7.3 6h12.6a1.1 1.1 0 0 1 1.06 1.38l-1.55 6a1.1 1.1 0 0 1-1.06.82H8.85l.35 1.5h9.4a1.1 1.1 0 1 1 0 2.2H8.3a1.1 1.1 0 0 1-1.07-.85L4.82 5.3H3.6a1.1 1.1 0 0 1-1.1-1.1Z"/>
                        <circle cx="9.2" cy="20" r="1.7"/>
                        <circle cx="17.3" cy="20" r="1.7"/>
                    </svg>
                    <span>Store</span>
                </button>

                <button type="button" class="nav-hitbox" aria-label="Settings" onclick="handleMenuAction('settings')">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6Z"/>
                    </svg>
                    <span>Settings</span>
                </button>
            </div>
        </div>

        <!-- 4th Screen: Gameplay Mode Selection Screen -->
        <img src="./assets/background.webp" alt="Gameplay Background" class="game-canvas" id="screenGameplayBg">

        <div class="gameplay-ui-layer" id="gameplayUi">
            <!-- Top Bar: Home & Settings Icons -->
            <div class="gameplay-top-bar">
                <button type="button" class="circle-icon-btn" aria-label="Back to Home" onclick="transitionGameplayToHome()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11.3 2.3a1 1 0 0 1 1.4 0l8.6 7.8a1 1 0 0 1-.67 1.74H19v8.16a1.5 1.5 0 0 1-1.5 1.5h-3.25a.75.75 0 0 1-.75-.75v-4.5a1.5 1.5 0 0 0-3 0v4.5a.75.75 0 0 1-.75.75H6.5A1.5 1.5 0 0 1 5 20v-8.16H3.37a1 1 0 0 1-.67-1.74l8.6-7.8Z"/>
                    </svg>
                </button>

                <button type="button" class="circle-icon-btn" aria-label="Settings" onclick="handleGameplaySettings()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.49.49 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58ZM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6Z"/>
                    </svg>
                </button>
            </div>

            <!-- Gameplay Title Image -->
            <div class="gameplay-header-banner">
                <img src="./assets/gameplay.webp" alt="Gameplay" class="gameplay-banner-img">
            </div>

            <!-- Game Mode Cards -->
            <div class="modes-list">
                <!-- Card 1: My Photo -->
                <div class="mode-card" onclick="selectGameMode('my-photo')">
                    <img src="./assets/pappy.webp" alt="My Photo" class="mode-art">
                    <div class="mode-divider"></div>
                    <div class="mode-info">
                        <div class="mode-title">My Photo</div>
                        <div class="mode-desc">Upload your own photo from your gallery.</div>
                    </div>
                    <button type="button" class="mode-play-btn" aria-label="Play My Photo">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/>
                        </svg>
                    </button>
                </div>

                <!-- Card 2: Levels -->
                <div class="mode-card" onclick="selectGameMode('levels')">
                    <img src="./assets/journey.webp" alt="Levels" class="mode-art">
                    <div class="mode-divider"></div>
                    <div class="mode-info">
                        <div class="mode-title">Levels</div>
                        <div class="mode-desc">Complete levels and unlock more puzzles.</div>
                    </div>
                    <button type="button" class="mode-play-btn" aria-label="Play Levels">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/>
                        </svg>
                    </button>
                </div>

                <!-- Card 3: Daily Challenge -->
                <div class="mode-card" onclick="selectGameMode('daily-challenge')">
                    <img src="./assets/calendar.webp" alt="Daily Challenge" class="mode-art">
                    <div class="mode-divider"></div>
                    <div class="mode-info">
                        <div class="mode-title">Daily Challenge</div>
                        <div class="mode-desc">Get a new hard challenge every day!</div>
                    </div>
                    <button type="button" class="mode-play-btn" aria-label="Play Daily Challenge">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- My Photo Grid Mode Screen UI (Uses background.webp) -->
        <div class="my-photo-ui-layer" id="myPhotoUi">
            <!-- Top Bar: Top-Left Coins Pill & Top-Right Home Button -->
            <div class="my-photo-top-bar">
                <div class="currency-bar" style="position: static;" aria-label="Currencies">
                    <div class="currency-pill">
                        <img src="./assets/coin.webp" alt="Coins" class="currency-icon">
                        <span class="currency-value" id="myPhotoCoinCount">250</span>
                        <button type="button" class="currency-plus-btn" aria-label="Add Coins" onclick="handleCurrencyPlus('coins')">+</button>
                    </div>
                </div>

                <button type="button" class="circle-icon-btn" aria-label="Back to Gameplay" onclick="transitionMyPhotoToGameplay()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M11.3 2.3a1 1 0 0 1 1.4 0l8.6 7.8a1 1 0 0 1-.67 1.74H19v8.16a1.5 1.5 0 0 1-1.5 1.5h-3.25a.75.75 0 0 1-.75-.75v-4.5a1.5 1.5 0 0 0-3 0v4.5a.75.75 0 0 1-.75.75H6.5A1.5 1.5 0 0 1 5 20v-8.16H3.37a1 1 0 0 1-.67-1.74l8.6-7.8Z"/>
                    </svg>
                </button>
            </div>

            <!-- Center Panel: Select Grid Mode, Upload a Photo, Continue -->
            <div class="my-photo-panel">
                <div class="grid-mode-heading-wrap">
                    <span class="grid-mode-heading-line"></span>
                    <div class="grid-mode-heading">Select grid mode</div>
                    <span class="grid-mode-heading-line"></span>
                </div>

                <div class="grid-selector-row">
                    <button type="button" class="grid-arrow-btn" aria-label="Previous Grid Mode" onclick="stepGridMode(-1)">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <polyline points="15 6 9 12 15 18"/>
                        </svg>
                    </button>

                    <div class="grid-cards-group">
                        <button type="button" class="grid-option-card active" data-grid="3" onclick="selectGridMode(3)">
                            <div class="grid-matrix cols-3">
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                            </div>
                            <span class="grid-option-label">3&times;3</span>
                        </button>

                        <button type="button" class="grid-option-card" data-grid="4" onclick="selectGridMode(4)">
                            <div class="grid-matrix cols-4">
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                            </div>
                            <span class="grid-option-label">4&times;4</span>
                        </button>

                        <button type="button" class="grid-option-card" data-grid="5" onclick="selectGridMode(5)">
                            <div class="grid-matrix cols-5">
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                                <span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span><span class="grid-cell"></span>
                            </div>
                            <span class="grid-option-label">5&times;5</span>
                        </button>
                    </div>

                    <button type="button" class="grid-arrow-btn" aria-label="Next Grid Mode" onclick="stepGridMode(1)">
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <polyline points="9 6 15 12 9 18"/>
                        </svg>
                    </button>
                </div>

                <div class="panel-divider-line"></div>

                <input type="file" id="myPhotoFileInput" accept="image/*" style="display: none;" onchange="handleMyPhotoFileSelected(event)">
                <div class="upload-photo-card" onclick="triggerMyPhotoUpload()">
                    <svg class="upload-cloud-icon" viewBox="0 0 24 24" aria-hidden="true">
                        <path d="M19.35 10.04A7.49 7.49 0 0 0 12 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 0 0 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96ZM14 13v4h-4v-4H7l5-5 5 5h-3Z"/>
                    </svg>
                    <div class="upload-card-divider"></div>
                    <div class="upload-card-label" id="uploadPhotoLabel">Upload a Photo</div>
                    <button type="button" class="upload-tray-btn" id="uploadActionBtn" aria-label="Upload Photo" onclick="handleUploadActionBtnClick(event)">
                        <svg id="uploadActionIcon" viewBox="0 0 24 24">
                            <path d="M12 15V4"/>
                            <polyline points="7 9 12 4 17 9"/>
                            <path d="M5 17v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2"/>
                        </svg>
                    </button>
                </div>

                <div class="continue-cta-wrap">
                    <button type="button" class="continue-btn" aria-label="Continue" onclick="handleMyPhotoContinue()">
                        <span>Continue</span>
                        <svg viewBox="0 0 24 24" aria-hidden="true">
                            <path d="M8 5.14v13.72a1 1 0 0 0 1.52.85l10.86-6.86a1 1 0 0 0 0-1.7L9.52 4.29A1 1 0 0 0 8 5.14Z"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>

        <!-- Settings Screen UI (Uses background.webp) -->
        <div class="settings-ui-layer" id="settingsUi">
            <!-- Top Row: Close (X) Button -->
            <div class="settings-top-row">
                <button type="button" class="settings-close-btn" aria-label="Close Settings" onclick="closeSettingsScreen()">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <line x1="6" y1="6" x2="18" y2="18"/>
                        <line x1="18" y1="6" x2="6" y2="18"/>
                    </svg>
                </button>
            </div>

            <!-- Center Group: Heading, Music & Sound Orbs, Language & Help Cards -->
            <div class="settings-center-group">
                <div class="settings-heading">SETTINGS</div>

                <div class="audio-toggles-row">
                    <div class="audio-toggle-item">
                        <button type="button" class="audio-orb-btn" id="musicToggleBtn" aria-label="Music" aria-pressed="false" onclick="toggleSettingAudio('music')">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M5.6 17.5c0-1.93 1.7-3.45 3.8-3.45 1.15 0 2.18.45 2.85 1.16V4.2h1.6c.4 1.6 1.5 2.7 3.3 3.2.7.2 1.1.8 1.1 1.5v1.6c0 .6-.5 1-1.1.8-1.4-.4-2.5-1-3.3-1.8v7.15c0 1.93-1.7 3.45-3.8 3.45h-.9c-2.1 0-3.8-1.52-3.8-3.45Z"/>
                            </svg>
                            <span class="audio-slash-line" aria-hidden="true"></span>
                        </button>
                        <span class="audio-toggle-label">MUSIC</span>
                    </div>

                    <div class="audio-toggle-item">
                        <button type="button" class="audio-orb-btn is-on" id="soundToggleBtn" aria-label="Sound" aria-pressed="true" onclick="toggleSettingAudio('sound')">
                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <path d="M4.5 9.6v4.8h3.4l4.6 4.2V5.4L7.9 9.6H4.5Zm11.7-1.4a1.1 1.1 0 0 1 1.55.1 5.6 5.6 0 0 1 0 7.4 1.1 1.1 0 1 1-1.65-1.45 3.4 3.4 0 0 0 0-4.5 1.1 1.1 0 0 1 .1-1.55Zm2.8-2.4a1.1 1.1 0 0 1 1.55.08 9 9 0 0 1 0 12.24 1.1 1.1 0 0 1-1.63-1.47 6.8 6.8 0 0 0 0-9.3 1.1 1.1 0 0 1 .08-1.55Z"/>
                            </svg>
                            <span class="audio-slash-line" aria-hidden="true"></span>
                        </button>
                        <span class="audio-toggle-label">SOUND</span>
                    </div>
                </div>

                <div class="settings-cards-stack">
                    <!-- Language Card -->
                    <div class="settings-row-card" onclick="handleSettingsOption('language')">
                        <svg class="settings-card-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9.2" fill="none" stroke="#1549b8" stroke-width="2.1"/>
                            <ellipse cx="12" cy="12" rx="4.4" ry="9.2" fill="none" stroke="#1549b8" stroke-width="2.1"/>
                            <line x1="3.1" y1="9.2" x2="20.9" y2="9.2" stroke="#1549b8" stroke-width="2.1"/>
                            <line x1="3.1" y1="14.8" x2="20.9" y2="14.8" stroke="#1549b8" stroke-width="2.1"/>
                        </svg>
                        <div class="settings-card-divider"></div>
                        <div class="settings-card-text">
                            <div class="settings-card-title">Language</div>
                            <div class="settings-card-sub" id="settingsLanguageValue">English</div>
                        </div>
                        <svg class="settings-card-chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <polyline points="9 6 15 12 9 18"/>
                        </svg>
                    </div>

                    <!-- Help Card -->
                    <div class="settings-row-card" onclick="handleSettingsOption('help')">
                        <svg class="settings-card-icon" viewBox="0 0 24 24" aria-hidden="true">
                            <circle cx="12" cy="12" r="9.5"/>
                            <path d="M9.35 9.15a2.75 2.75 0 0 1 5.3.9c0 1.85-2.65 2.15-2.65 4.15" fill="none" stroke="#ffffff" stroke-width="2.35" stroke-linecap="round"/>
                            <circle cx="12" cy="17.2" r="1.3" fill="#ffffff"/>
                        </svg>
                        <div class="settings-card-divider"></div>
                        <div class="settings-card-text">
                            <div class="settings-card-title">Help</div>
                        </div>
                        <svg class="settings-card-chevron" viewBox="0 0 24 24" aria-hidden="true">
                            <polyline points="9 6 15 12 9 18"/>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Footer Links & Version -->
            <div class="settings-footer">
                <div class="settings-footer-links">
                    <button type="button" class="settings-footer-btn" onclick="handleSettingsFooter('delete-account')">Delete Account</button>
                    <span class="settings-footer-sep">|</span>
                    <button type="button" class="settings-footer-btn" onclick="handleSettingsFooter('privacy-data')">Privacy &amp; Data</button>
                </div>
                <div class="settings-build-version">Build 5.8.0</div>
            </div>
        </div>
    </div>

    <script>
        function lockPortraitOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }

        window.addEventListener('load', () => {
            lockPortraitOrientation();
            startSequence();
        });

        window.addEventListener('orientationchange', () => {
            lockPortraitOrientation();
        });

        function startSequence() {
            setTimeout(() => {
                transitionToLoadingScreen();
            }, 3000);
        }

        function transitionToLoadingScreen() {
            const studioScreen = document.getElementById('screenStudio');
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');

            studioScreen.classList.remove('active');
            loadingBg.classList.add('active');
            loadingUi.classList.add('active');

            runLoadingSequence();
        }

        function runLoadingSequence() {
            let currentProgress = 0;
            const fillElement = document.getElementById('progressBarFill');
            const textElement = document.getElementById('loadingText');

            let dotCounter = 0;
            const textInterval = setInterval(() => {
                dotCounter = (dotCounter % 3) + 1;
                textElement.textContent = "Loading" + ".".repeat(dotCounter);
            }, 400);

            const totalDuration = 2500;
            const intervalStep = 25;
            const incrementAmount = 100 / (totalDuration / intervalStep);

            const progressInterval = setInterval(() => {
                currentProgress += incrementAmount;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(progressInterval);
                    clearInterval(textInterval);

                    setTimeout(transitionToMenuScreen, 350);
                }

                const roundedProgress = Math.floor(currentProgress);
                fillElement.style.width = roundedProgress + '%';
            }, intervalStep);
        }

        function transitionToMenuScreen() {
            const loadingBg = document.getElementById('screenLoadingBg');
            const loadingUi = document.getElementById('loadingUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            loadingBg.classList.remove('active');
            loadingUi.classList.remove('active');

            menuBg.classList.add('active');
            menuUi.classList.add('active');
        }

        function transitionHomeToGameplay() {
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');
            const gameplayBg = document.getElementById('screenGameplayBg');
            const gameplayUi = document.getElementById('gameplayUi');

            menuBg.classList.remove('active');
            menuUi.classList.remove('active');

            gameplayBg.classList.add('active');
            gameplayUi.classList.add('active');
        }

        function transitionGameplayToHome() {
            const gameplayBg = document.getElementById('screenGameplayBg');
            const gameplayUi = document.getElementById('gameplayUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            gameplayBg.classList.remove('active');
            gameplayUi.classList.remove('active');

            menuBg.classList.add('active');
            menuUi.classList.add('active');
        }

        function transitionGameplayToMyPhoto() {
            const gameplayUi = document.getElementById('gameplayUi');
            const gameplayBg = document.getElementById('screenGameplayBg');
            const myPhotoUi = document.getElementById('myPhotoUi');

            gameplayUi.classList.remove('active');
            gameplayBg.classList.add('active');
            myPhotoUi.classList.add('active');
        }

        function transitionMyPhotoToGameplay() {
            const myPhotoUi = document.getElementById('myPhotoUi');
            const gameplayBg = document.getElementById('screenGameplayBg');
            const gameplayUi = document.getElementById('gameplayUi');

            myPhotoUi.classList.remove('active');
            gameplayBg.classList.add('active');
            gameplayUi.classList.add('active');
        }

        let selectedGridSize = 3;
        let uploadedPhotoDataUrl = null;

        function setUploadActionIcon(hasPhoto) {
            const btn = document.getElementById('uploadActionBtn');
            const icon = document.getElementById('uploadActionIcon');
            if (!btn || !icon) return;

            if (hasPhoto) {
                btn.setAttribute('aria-label', 'Delete Uploaded Photo');
                icon.innerHTML = `
                    <path d="M3 6h18"/>
                    <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                    <path d="M19 6l-1 14a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1L5 6"/>
                    <line x1="10" y1="11" x2="10" y2="17"/>
                    <line x1="14" y1="11" x2="14" y2="17"/>
                `;
            } else {
                btn.setAttribute('aria-label', 'Upload Photo');
                icon.innerHTML = `
                    <path d="M12 15V4"/>
                    <polyline points="7 9 12 4 17 9"/>
                    <path d="M5 17v2a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-2"/>
                `;
            }
        }

        function clearUploadedPhoto() {
            uploadedPhotoDataUrl = null;
            const fileInput = document.getElementById('myPhotoFileInput');
            if (fileInput) {
                fileInput.value = '';
            }
            document.getElementById('uploadPhotoLabel').textContent = 'Upload a Photo';
            setUploadActionIcon(false);
        }

        function handleUploadActionBtnClick(event) {
            event.stopPropagation();
            if (uploadedPhotoDataUrl) {
                clearUploadedPhoto();
            } else {
                triggerMyPhotoUpload();
            }
        }

        function selectGridMode(size) {
            selectedGridSize = size;
            document.querySelectorAll('.grid-option-card').forEach(card => {
                card.classList.toggle('active', Number(card.dataset.grid) === size);
            });
        }

        function stepGridMode(delta) {
            const sizes = [3, 4, 5];
            const currentIndex = sizes.indexOf(selectedGridSize);
            const nextIndex = (currentIndex + delta + sizes.length) % sizes.length;
            selectGridMode(sizes[nextIndex]);
        }

        function triggerMyPhotoUpload() {
            document.getElementById('myPhotoFileInput').click();
        }

        function handleMyPhotoFileSelected(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;
            document.getElementById('uploadPhotoLabel').textContent = file.name;
            const reader = new FileReader();
            reader.onload = function(e) {
                uploadedPhotoDataUrl = e.target.result;
                setUploadActionIcon(true);
            };
            reader.readAsDataURL(file);
        }

        function handleMyPhotoContinue() {
            console.log("My Photo continue clicked:", { grid: selectedGridSize, hasPhoto: Boolean(uploadedPhotoDataUrl) });
        }

        let previousScreenBeforeSettings = 'menu';
        let musicEnabled = false;
        let soundEnabled = true;

        function openSettingsScreen(sourceScreen) {
            previousScreenBeforeSettings = sourceScreen;

            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');
            const gameplayBg = document.getElementById('screenGameplayBg');
            const gameplayUi = document.getElementById('gameplayUi');
            const myPhotoUi = document.getElementById('myPhotoUi');
            const settingsUi = document.getElementById('settingsUi');

            menuBg.classList.remove('active');
            menuUi.classList.remove('active');
            gameplayUi.classList.remove('active');
            myPhotoUi.classList.remove('active');

            gameplayBg.classList.add('active');
            settingsUi.classList.add('active');
        }

        function closeSettingsScreen() {
            const settingsUi = document.getElementById('settingsUi');
            const gameplayBg = document.getElementById('screenGameplayBg');
            const gameplayUi = document.getElementById('gameplayUi');
            const menuBg = document.getElementById('screenMenuBg');
            const menuUi = document.getElementById('menuUi');

            settingsUi.classList.remove('active');

            if (previousScreenBeforeSettings === 'gameplay') {
                gameplayBg.classList.add('active');
                gameplayUi.classList.add('active');
            } else {
                gameplayBg.classList.remove('active');
                menuBg.classList.add('active');
                menuUi.classList.add('active');
            }
        }

        function toggleSettingAudio(type) {
            if (type === 'music') {
                musicEnabled = !musicEnabled;
                const btn = document.getElementById('musicToggleBtn');
                btn.classList.toggle('is-on', musicEnabled);
                btn.setAttribute('aria-pressed', String(musicEnabled));
            } else if (type === 'sound') {
                soundEnabled = !soundEnabled;
                const btn = document.getElementById('soundToggleBtn');
                btn.classList.toggle('is-on', soundEnabled);
                btn.setAttribute('aria-pressed', String(soundEnabled));
            }
        }

        function handleSettingsOption(option) {
            console.log("Settings option clicked:", option);
        }

        function handleSettingsFooter(action) {
            console.log("Settings footer action:", action);
        }

        let coins = 250;

        function updateCurrencyDisplay() {
            const formatted = coins.toLocaleString();
            document.getElementById('coinCount').textContent = formatted;
            const myPhotoCoinEl = document.getElementById('myPhotoCoinCount');
            if (myPhotoCoinEl) {
                myPhotoCoinEl.textContent = formatted;
            }
        }

        function handleCurrencyPlus(type) {
            console.log("Currency plus clicked:", type);
        }

        function handleMenuAction(actionType) {
            if (actionType === 'play') {
                transitionHomeToGameplay();
            } else if (actionType === 'settings') {
                openSettingsScreen('menu');
            } else {
                console.log("Menu action triggered:", actionType);
            }
        }

        function handleGameplaySettings() {
            openSettingsScreen('gameplay');
        }

        function selectGameMode(mode) {
            if (mode === 'my-photo') {
                transitionGameplayToMyPhoto();
                return;
            }
            console.log("Selected game mode:", mode);
        }

        updateCurrencyDisplay();
    </script>
</body>
</html>
