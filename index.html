<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TileyPop - Napo Studios</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            position: fixed;
            touch-action: none;
        }

        .screen-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000000;
        }

        .screen-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 0.55s ease-in-out;
            pointer-events: none;
        }

        .screen-bg.logo-bg {
            object-fit: contain;
            background-color: #000000;
        }

        .screen-bg.active {
            opacity: 1;
        }

        /* --- Screen 2: Loading UI positioned to match load.webp --- */
        .loading-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .loading-ui-layer.active {
            opacity: 1;
        }

        .loading-controls {
            position: absolute;
            top: 57.5%;
            width: 72%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .progress-bar-track {
            width: 100%;
            height: 28px;
            padding: 3px;
            background: rgba(235, 245, 255, 0.9);
            border: 2.5px solid #1d6fd8;
            border-radius: 999px;
            box-shadow: 0 4px 12px rgba(15, 76, 158, 0.18), inset 0 2px 4px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(180deg, #4da3ff 0%, #1668dc 55%, #0c4da8 100%);
            border-radius: 999px;
            transition: width 0.08s linear;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.65);
        }

        .loading-text {
            margin-top: 12px;
            color: #1668dc;
            font-size: 1.55rem;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-shadow: 0 2px 0 rgba(255, 255, 255, 0.85);
        }

        /* --- Screen 3: Home UI Hitboxes matching home.webp --- */
        .home-ui-layer {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease-in-out;
        }

        .home-ui-layer.active {
            opacity: 1;
            pointer-events: auto;
        }

        .play-hitbox {
            position: absolute;
            top: 49%;
            left: 50%;
            transform: translateX(-50%);
            width: 62%;
            max-width: 300px;
            height: 10.5%;
            min-height: 54px;
            max-height: 78px;
            border-radius: 999px;
            cursor: pointer;
            background: transparent;
        }

        .nav-cards-row {
            position: absolute;
            top: 63.5%;
            left: 50%;
            transform: translateX(-50%);
            width: 82%;
            max-width: 400px;
            height: 13.5%;
            min-height: 74px;
            max-height: 105px;
            display: flex;
            justify-content: space-between;
            align-items: stretch;
            gap: 12px;
        }

        .nav-card-hitbox {
            flex: 1;
            border-radius: 20px;
            cursor: default;
            background: transparent;
        }
    </style>
</head>
<body>

    <div class="screen-container" id="appContainer">
        <!-- 1. Studio Splash Screen -->
        <img src="../assets/studio.webp" alt="Napo Studios" class="screen-bg logo-bg active" id="screenStudio">

        <!-- 2. Loading Screen -->
        <img src="../assets/load.webp" alt="TileyPop Loading" class="screen-bg" id="screenLoadBg">
        <div class="loading-ui-layer" id="loadingUi">
            <div class="loading-controls">
                <div class="progress-bar-track">
                    <div class="progress-bar-fill" id="progressBarFill"></div>
                </div>
                <div class="loading-text" id="loadingText">Loading...</div>
            </div>
        </div>

        <!-- 3. Home Screen -->
        <img src="../assets/home.webp" alt="TileyPop Home" class="screen-bg" id="screenHomeBg">
        <div class="home-ui-layer" id="homeUi">
            <div class="play-hitbox" role="button" aria-label="Play" onclick="handlePlay()"></div>
            <div class="nav-cards-row">
                <!-- Progress, Store, and Settings are intentionally disabled for now -->
                <div class="nav-card-hitbox" aria-label="Progress (Disabled)" onclick="handleDisabledNav('progress')"></div>
                <div class="nav-card-hitbox" aria-label="Store (Disabled)" onclick="handleDisabledNav('store')"></div>
                <div class="nav-card-hitbox" aria-label="Settings (Disabled)" onclick="handleDisabledNav('settings')"></div>
            </div>
        </div>
    </div>

    <script>
        function lockPortraitOrientation() {
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('portrait').catch(() => {});
            }
        }

        window.addEventListener('load', () => {
            lockPortraitOrientation();
            startIntroSequence();
        });

        window.addEventListener('orientationchange', () => {
            lockPortraitOrientation();
        });

        function startIntroSequence() {
            setTimeout(() => {
                transitionToLoadingScreen();
            }, 3000);
        }

        function transitionToLoadingScreen() {
            const studioScreen = document.getElementById('screenStudio');
            const loadBg = document.getElementById('screenLoadBg');
            const loadingUi = document.getElementById('loadingUi');

            studioScreen.classList.remove('active');
            loadBg.classList.add('active');
            loadingUi.classList.add('active');

            runLoadingSequence();
        }

        function runLoadingSequence() {
            let currentProgress = 0;
            const fillElement = document.getElementById('progressBarFill');
            const textElement = document.getElementById('loadingText');

            let dotCounter = 3;
            const textInterval = setInterval(() => {
                dotCounter = (dotCounter % 3) + 1;
                textElement.textContent = "Loading" + ".".repeat(dotCounter);
            }, 400);

            const totalDuration = 2500;
            const intervalStep = 25;
            const incrementAmount = 100 / (totalDuration / intervalStep);

            const progressInterval = setInterval(() => {
                currentProgress += incrementAmount;
                if (currentProgress >= 100) {
                    currentProgress = 100;
                    clearInterval(progressInterval);
                    clearInterval(textInterval);
                    fillElement.style.width = '100%';

                    setTimeout(transitionToHomeScreen, 350);
                    return;
                }

                fillElement.style.width = currentProgress.toFixed(1) + '%';
            }, intervalStep);
        }

        function transitionToHomeScreen() {
            const loadBg = document.getElementById('screenLoadBg');
            const loadingUi = document.getElementById('loadingUi');
            const homeBg = document.getElementById('screenHomeBg');
            const homeUi = document.getElementById('homeUi');

            loadBg.classList.remove('active');
            loadingUi.classList.remove('active');

            homeBg.classList.add('active');
            homeUi.classList.add('active');
        }

        function handlePlay() {
            console.log("TileyPop: Play triggered");
        }

        function handleDisabledNav(target) {
            // Disabled for now: Progress, Store, and Settings do nothing yet.
            void target;
        }
    </script>
</body>
</html>
